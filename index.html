<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キネコ PR活動 保管庫</title>
<style>
:root{
  --bg:#faf7f2; --panel:#fff; --ink:#1f1b16; --muted:#7a7168; --line:#e7ded1;
  --accent:#dd5a2f; --accent-soft:#fdeee8;
  --blue:#3178b8; --blue-soft:#e8f0f8;
  --violet:#6b4ea8; --violet-soft:#efe9fa;
  --green:#3f7d4f; --green-soft:#e6f1e8;
  --amber:#a8760c; --amber-soft:#fbf0d8;
  --gray:#94897c; --gray-soft:#f0ece5;
  --shadow:0 1px 2px rgba(31,27,22,.05), 0 8px 24px rgba(31,27,22,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17140f; --panel:#211d17; --ink:#f2ece2; --muted:#a3998b; --line:#352f26;
  --accent:#e8663a; --accent-soft:#3a2117;
  --blue:#4f9cd8; --blue-soft:#16283a;
  --violet:#b39ae8; --violet-soft:#241a3a;
  --green:#6fb583; --green-soft:#16301d;
  --amber:#e0b355; --amber-soft:#332609;
  --gray:#7f766c; --gray-soft:#2a251f;
}}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",system-ui,-apple-system,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 90px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:24px;margin:0;letter-spacing:.01em}
h1 small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:5px}
button,.btn{font:inherit;font-size:13px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:.15s;text-decoration:none}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}

/* ロードマップ帯 */
.road{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.road-h{font-size:14px;font-weight:800;margin-bottom:16px}
.road-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rd{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--bg);position:relative}
.rd.now{border-color:var(--accent);background:var(--accent-soft)}
.rd-y{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.rd.now .rd-y{color:var(--accent)}
.rd-t{font-size:13.5px;font-weight:700;margin-top:5px;line-height:1.55}
.rd-badge{position:absolute;top:-9px;right:12px;font-size:10px;font-weight:800;color:#fff;
  background:var(--accent);padding:2px 9px;border-radius:999px}
@media(max-width:700px){.road-grid{grid-template-columns:1fr}}

/* 集計 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow)}
.tile .n{font-size:27px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.tile .l{font-size:11.5px;color:var(--muted);margin-top:2px}

/* 絞り込み */
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.f-l{font-size:11.5px;font-weight:800;color:var(--muted);margin-right:2px}
.chip{font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);cursor:pointer;box-shadow:none}
.chip b{margin-left:4px;opacity:.6;font-weight:800}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on b{opacity:.85}

/* タイムライン */
.year{display:flex;align-items:center;gap:12px;margin:30px 0 16px}
.year h2{font-size:19px;margin:0;letter-spacing:.02em}
.year .cnt{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.year hr{flex:1;border:none;border-top:1px solid var(--line);margin:0}
.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.item{position:relative;margin-bottom:13px}
.item::before{content:'';position:absolute;left:-26px;top:19px;width:11px;height:11px;border-radius:50%;
  background:var(--panel);border:2.5px solid var(--gray)}
.item.t-投稿::before{border-color:var(--accent)}
.item.t-活動::before{border-color:var(--blue)}
.item.t-制作物::before{border-color:var(--violet)}
.item.t-報告書::before{border-color:var(--green)}
.item.t-メディア掲載::before{border-color:var(--amber)}
.item.plan::before{background:var(--accent);border-color:var(--accent);width:15px;height:15px;left:-28px;top:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 17px;box-shadow:var(--shadow)}
.item.plan .card{border-left:4px solid var(--accent);background:var(--accent-soft)}
.c-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.date{font-size:11.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;
  background:var(--gray-soft);color:var(--gray)}
.badge.b-投稿{background:var(--accent-soft);color:var(--accent)}
.badge.b-活動{background:var(--blue-soft);color:var(--blue)}
.badge.b-制作物{background:var(--violet-soft);color:var(--violet)}
.badge.b-報告書{background:var(--green-soft);color:var(--green)}
.badge.b-メディア掲載{background:var(--amber-soft);color:var(--amber)}
.who{font-size:11.5px;color:var(--muted);margin-left:auto}
.title{font-size:15px;font-weight:700;line-height:1.55;word-break:break-word}
.desc{font-size:13px;color:var(--muted);margin-top:5px;white-space:pre-wrap;line-height:1.7}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.pill{font-size:11.5px;padding:3px 11px;border-radius:999px;background:var(--bg);
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.num{background:var(--green-soft);color:var(--green);border-color:transparent;font-weight:700}
a.link{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;
  border:1px solid var(--accent);border-radius:999px;padding:3px 12px;white-space:nowrap}
a.link:hover{background:var(--accent);color:#fff}
.empty{color:var(--muted);font-size:13.5px;padding:26px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);text-align:center}
.note{font-size:12.5px;background:var(--amber-soft);color:var(--amber);border-radius:12px;
  padding:11px 15px;margin-bottom:18px;font-weight:600}

button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{opacity:.88;color:#fff;border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.modal{position:fixed;inset:0;background:rgba(31,27,22,.45);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal[hidden]{display:none}
@media(min-width:640px){.modal{align-items:center;padding:24px}}
.sheetbox{background:var(--panel);border-radius:20px 20px 0 0;width:100%;max-width:560px;
  max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.sheetbox{border-radius:20px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 13px;
  border-bottom:1px solid var(--line);font-size:16px;font-weight:800}
.sh-h button{border:none;background:none;box-shadow:none;font-size:24px;line-height:1;
  color:var(--muted);padding:0 4px;cursor:pointer}
.sh-b{overflow-y:auto;padding:18px 20px 8px}
.fld{display:block;margin-bottom:15px}
.lb{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
.lb em{font-style:normal;font-weight:600;opacity:.7;margin-left:6px;font-size:11px}
.fld input[type=text],.fld input[type=url],.fld input[type=date],.fld input:not([type]),.fld textarea{
  font:inherit;font-size:15px;width:100%;padding:10px 13px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
.fld input[type=file]{font:inherit;font-size:12.5px;width:100%;color:var(--muted)}
.fld textarea{resize:vertical;line-height:1.7}
.sub{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.seg button{font-size:12.5px;padding:6px 13px;border-radius:999px;box-shadow:none;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sh-f{position:sticky;bottom:0;background:var(--panel);display:flex;gap:9px;align-items:center;
  justify-content:flex-end;padding:14px 0 18px;border-top:1px solid var(--line);margin-top:4px}
.err{font-size:12px;color:var(--accent);font-weight:700;margin-right:auto;text-align:left}
.card[data-id]{cursor:pointer;transition:.13s}
.card[data-id]:hover{border-color:var(--accent);transform:translateY(-1px)}
.card[data-id]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.danger{color:var(--accent);border-color:var(--line)}
button.danger:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.drow{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.drow:last-of-type{border-bottom:none}
.drow dt{font-size:11.5px;font-weight:800;color:var(--muted);margin:0}
.drow dd{margin:0;font-size:14px;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.drow dd a{color:var(--accent);word-break:break-all}
.dimg{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.dimg img{display:block;width:100%;height:auto}
@media(max-width:480px){.drow{grid-template-columns:1fr;gap:2px;padding:8px 0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;
  background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:700;
  padding:11px 20px;border-radius:999px;box-shadow:var(--shadow)}
footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.85}
footer a{color:var(--accent)}
@media(max-width:600px){
  .wrap{padding:20px 14px 70px} h1{font-size:20px}
  .tiles{grid-template-columns:1fr 1fr} .who{margin-left:0;flex-basis:100%}
  .tl{padding-left:22px} .tl::before{left:4px} .item::before{left:-23px} .item.plan::before{left:-25px}
}
@media print{ .toolbar,.filters{display:none!important} body{background:#fff} }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>キネコ PR活動 保管庫<small id="meta">読み込み中…</small></h1>
  <div class="toolbar">
    <button class="primary" id="add">＋ 活動を追加</button>
    <button id="csv">CSVで書き出す</button>
    <button id="reload">最新に更新</button>
  </div>
</header>

<div id="road"></div>
<div class="tiles" id="tiles"></div>
<div class="filters" id="filters"></div>
<div id="body"></div>

<footer>
  <b>新しい活動は、右上の「＋ 活動を追加」から登録できます。</b>スマホからでも書けます。<br>
  書き間違えたときは、げんきさんに言えば直せます。
</footer>
</div>

<div class="modal" id="dmodal" hidden>
  <div class="sheetbox">
    <div class="sh-h"><span id="d-title">活動の詳細</span><button id="dx" aria-label="閉じる">×</button></div>
    <div class="sh-b" id="dbody"></div>
    <div class="sh-f" style="padding:14px 20px 18px">
      <button id="del" class="danger">削除</button>
      <button id="edit">編集</button>
      <button id="dclose" class="primary">閉じる</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheetbox" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sh-h"><span id="sh-title">活動を追加</span><button id="x" aria-label="閉じる">×</button></div>
    <form id="f" class="sh-b">
      <label class="fld">
        <span class="lb">投稿・記事のURL</span>
        <input name="url" type="url" placeholder="https://www.instagram.com/p/…" autocomplete="off">
        <span class="sub" id="guess">URLを貼ると、種別と媒体を自動で入れます</span>
      </label>
      <div class="fld">
        <span class="lb">種別</span>
        <div class="seg" id="kindseg"></div>
      </div>
      <div class="row2">
        <label class="fld"><span class="lb">日付</span><input name="date" type="date" required></label>
        <label class="fld"><span class="lb">媒体・場所</span><input name="place" placeholder="Instagram / 会場名など"></label>
      </div>
      <label class="fld"><span class="lb">タイトル</span><input name="title" required placeholder="ひと言で"></label>
      <div class="fld">
        <span class="lb">担当</span>
        <div class="seg" id="whoseg"></div>
        <input name="who" placeholder="名前や団体名でもOK">
      </div>
      <label class="fld">
        <span class="lb">反応・数字</span>
        <input name="metrics" placeholder="いいね40・コメント0 / 参加15名 など">
        <span class="sub">あとで振り返るときに一番効く項目です</span>
      </label>
      <label class="fld"><span class="lb">概要<em>任意</em></span><textarea name="description" rows="3" placeholder="何をしたか、2〜3行で"></textarea></label>
      <label class="fld"><span class="lb">資料ファイル<em>任意</em></span><input name="file" type="file"><span class="sub">ポスター・報告書など</span></label>
      <div class="sh-f">
        <span class="err" id="err"></span>
        <button type="button" id="cancel">やめる</button>
        <button type="submit" class="primary" id="save">保存する</button>
      </div>
    </form>
  </div>
</div>

<script>
const SB_URL='https://rxlwqkadnqdhcxwcbftr.supabase.co';
const SB_KEY='sb_publishable_Hhgxb1f-PMfHIziyIF8Viw_MM8z35iG';
const READY=/^https:\/\//.test(SB_URL) && SB_KEY.length>20;
const REST=SB_URL+'/rest/v1/pr_activities';
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const FALLBACK="日付,種別,タイトル,媒体・場所,担当,概要,URL,ファイル,反応・数字,年度,タグ\n2026-07-24,投稿,【大きなエアスクリーンで夏の夜を楽しみませんか？】,Instagram,キネコ公式,,https://www.instagram.com/p/DbMkEfyAc80/,,いいね40・コメント0,2026,野外上映\n2026-07-25,投稿,【監督に直接、質問できるかも！？】,Instagram,キネコ公式,,https://www.instagram.com/kineko_filmfes/p/DbPxeB-gT_6/,,いいね31・コメント0,2026,ゲスト\n2026-07-26,投稿,【主演俳優 登壇決定！】,Instagram,キネコ公式,,https://www.instagram.com/kineko_filmfes/p/DbRzpnkgdyF/,,いいね37・コメント0,2026,ゲスト\n2026-08-09,投稿,映画を観終えたあと、この作品が伝えたかったことを理解し…,Instagram（リール）,キネコ公式,,https://www.instagram.com/reel/Db2Xap-B76y/,,いいね51・コメント1,2026,感想・リール\n2026-08-11,投稿,映画を観たあとの、素直な感想。,Instagram（リール）,キネコ公式,,https://www.instagram.com/reel/Db7O3G4hYud/,,いいね31・コメント0,2026,感想・リール\n2026-08-28,活動,ティーンズPR活動 ボランティア説明会,新宿三丁目 カイクラフト本社 ＋ Zoom,あつこさん,来社8名・Zoom7名が参加予定。事前アンケート29件の回答まとめは右のURL,https://yamadagenki0526icloudcom-hash.github.io/kineko-volunteers/,,,2026,ボランティア\n2026-04-01,計画・目標,【1年目】ボランティアと協力してPR活動を始める,,,※たたき台。あつこさんと詰める,,,,2026,ロードマップ\n2027-04-01,計画・目標,【2年目】ボランティアがPRの内容を自分たちで考える段階へ,,,※たたき台。あつこさんと詰める,,,,2027,ロードマップ\n2028-04-01,計画・目標,【3年目】企画・ゲスト選定・営業までボランティアが自走する,,,※たたき台。あつこさんと詰める,,,,2028,ロードマップ\n";
const KINDS=['投稿','制作物','活動','報告書','メディア掲載','計画・目標'];
const WHOS=['ボランティア','キネコ公式','スタッフ'];

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fromDB(rows){
  return rows.map(r=>({id:r.id,date:(r.date||'').slice(0,10),kind:r.kind||'その他',title:r.title||'',
    place:r.place||'',who:r.who||'',desc:r.description||'',url:r.url||'',
    file:r.file_url||'',num:r.metrics||'',year:'',tag:r.tag||''}));
}
function toItems(rows){
  const head=rows[0].map(s=>s.trim());
  const ix=n=>head.findIndex(h=>h.includes(n));
  const I={date:ix('日付'),kind:ix('種別'),title:ix('タイトル'),place:ix('媒体'),
           who:ix('担当'),desc:ix('概要'),url:ix('URL'),file:ix('ファイル'),
           num:ix('反応'),year:ix('年度'),tag:ix('タグ')};
  const g=(r,k)=>I[k]>=0?(r[I[k]]||'').trim():'';
  return rows.slice(1).map(r=>({
    date:g(r,'date'), kind:g(r,'kind')||'その他', title:g(r,'title'),
    place:g(r,'place'), who:g(r,'who'), desc:g(r,'desc'), url:g(r,'url'),
    file:g(r,'file'), num:g(r,'num'), year:g(r,'year'), tag:g(r,'tag'),
  })).filter(x=>x.date||x.title);
}

let ITEMS=[], fKind='', fYear='';

function fiscal(d){ const m=/^(\d{4})-(\d{2})/.exec(d); if(!m) return '';
  return (+m[2]>=4? +m[1] : +m[1]-1)+''; }

function render(){
  const years=[...new Set(ITEMS.map(i=>i.year||fiscal(i.date)).filter(Boolean))].sort();
  const kinds=[...new Set(ITEMS.map(i=>i.kind))];
  const P=ITEMS.filter(i=>(!fKind||i.kind===fKind)&&(!fYear||(i.year||fiscal(i.date))===fYear));

  /* ロードマップ */
  const plans=ITEMS.filter(i=>/計画|目標/.test(i.kind)).sort((a,b)=>a.date.localeCompare(b.date));
  const nowY=fiscal(new Date().toISOString().slice(0,10));
  document.getElementById('road').innerHTML = plans.length? `<div class="road">
    <div class="road-h">3年計画</div>
    <div class="road-grid">${plans.map(p=>{
      const y=p.year||fiscal(p.date), now=y===nowY;
      return `<div class="rd${now?' now':''}">
        ${now?'<span class="rd-badge">いまここ</span>':''}
        <div class="rd-y">${esc(y)}年度</div>
        <div class="rd-t">${esc(p.title.replace(/^【.+?】/,''))}</div>
      </div>`;}).join('')}</div></div>`:'';

  /* 集計 */
  const done=ITEMS.filter(i=>!/計画|目標/.test(i.kind));
  const posts=done.filter(i=>i.kind==='投稿').length;
  const acts=done.filter(i=>i.kind==='活動').length;
  const vol=done.filter(i=>/ボランティア/.test(i.who)).length;
  document.getElementById('tiles').innerHTML=`
    <div class="tile"><div class="n">${done.length}</div><div class="l">記録された活動</div></div>
    <div class="tile"><div class="n">${posts}</div><div class="l">投稿</div></div>
    <div class="tile"><div class="n">${acts}</div><div class="l">イベント・集まり</div></div>
    <div class="tile"><div class="n">${vol}</div><div class="l">ボランティアが担当</div></div>`;

  /* 絞り込み */
  const chip=(v,l,n,cur,attr)=>`<button class="chip${cur===v?' on':''}" data-${attr}="${esc(v)}">${esc(l)}<b>${n}</b></button>`;
  document.getElementById('filters').innerHTML=
    `<span class="f-l">種別</span>`+
    chip('','すべて',ITEMS.length,fKind,'kind')+
    kinds.map(k=>chip(k,k,ITEMS.filter(i=>i.kind===k).length,fKind,'kind')).join('')+
    (years.length>1?`<span class="f-l" style="margin-left:10px">年度</span>`+
      chip('','すべて',ITEMS.length,fYear,'year')+
      years.map(y=>chip(y,y+'年度',ITEMS.filter(i=>(i.year||fiscal(i.date))===y).length,fYear,'year')).join(''):'');

  /* タイムライン */
  const byYear={};
  P.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(i=>{
    const y=i.year||fiscal(i.date)||'日付なし'; (byYear[y]=byYear[y]||[]).push(i); });
  const keys=Object.keys(byYear).sort().reverse();
  document.getElementById('body').innerHTML = keys.length? keys.map(y=>`
    <div class="year"><h2>${esc(y)}年度</h2><span class="cnt">${byYear[y].length}件</span><hr></div>
    <div class="tl">${byYear[y].map(card).join('')}</div>`).join('')
    : `<div class="empty">該当する記録がありません</div>`;
}

function card(i){
  const plan=/計画|目標/.test(i.kind);
  return `<div class="item t-${esc(i.kind)}${plan?' plan':''}">
    <div class="card" data-id="${esc(i.id||'')}" tabindex="0" role="button">
      <div class="c-top">
        <span class="date">${esc(i.date)}</span>
        <span class="badge b-${esc(i.kind)}">${esc(i.kind)}</span>
        ${i.who?`<span class="who">${esc(i.who)}</span>`:''}
      </div>
      <div class="title">${esc(i.title)}</div>
      ${i.desc?`<div class="desc">${esc(i.desc)}</div>`:''}
      <div class="meta">
        ${i.place?`<span class="pill">${esc(i.place)}</span>`:''}
        ${i.tag?`<span class="pill">${esc(i.tag)}</span>`:''}
        ${i.num?`<span class="pill num">${esc(i.num)}</span>`:''}
        ${i.url?`<a class="link" href="${esc(i.url)}" target="_blank" rel="noopener">開く</a>`:''}
        ${i.file?`<a class="link" href="${esc(i.file)}" target="_blank" rel="noopener">資料</a>`:''}
      </div>
    </div></div>`;
}

document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  if('kind' in c.dataset) fKind=c.dataset.kind;
  if('year' in c.dataset) fYear=c.dataset.year;
  render();
});
document.getElementById('reload').onclick=()=>load();

function setMeta(txt){ document.getElementById('meta').textContent=txt; }

async function load(){
  if(READY){
    try{
      const res=await fetch(REST+'?select=*&order=date.desc',{headers:H,cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      ITEMS=fromDB(await res.json());
      setMeta(`全${ITEMS.length}件`);
      document.querySelector('.note')?.remove();
      render(); return;
    }catch(err){ showNote('データを読み込めませんでした（'+err.message+'）'); }
  }else{
    showNote('まだ保管庫のデータベースに繋がっていません。下は見本の表示です。');
  }
  ITEMS=toItems(parseCSV(FALLBACK));
  setMeta(`全${ITEMS.length}件（見本）`);
  render();
}
function showNote(msg){
  document.querySelector('.note')?.remove();
  const d=document.createElement('div'); d.className='note'; d.textContent=msg;
  document.getElementById('road').before(d);
}
function toast(msg){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}

/* ============ 追加フォーム ============ */
const modal=document.getElementById('modal'), form=document.getElementById('f');
const dmodal=document.getElementById('dmodal');
let pickKind='投稿', pickWho='', editingId=null, detailItem=null;
const CODE_KEY='kineko-pr-edit-code';
function getCode(){
  let c=localStorage.getItem(CODE_KEY)||'';
  if(!c){ c=(prompt('編集・削除には合言葉が必要です')||'').trim();
          if(c) localStorage.setItem(CODE_KEY,c); }
  return c;
}
function clearCode(){ localStorage.removeItem(CODE_KEY); }
function codeHeaders(){ return {...H,'x-edit-code':getCode(),Prefer:'return=representation'}; }

function seg(el,list,cur,onPick){
  el.innerHTML=list.map(v=>`<button type="button" class="${v===cur?'on':''}">${v}</button>`).join('');
  [...el.children].forEach(b=>b.onclick=()=>{ onPick(b.textContent);
    [...el.children].forEach(x=>x.classList.toggle('on',x===b)); });
}
function openModal(item){
  form.reset(); document.getElementById('err').textContent='';
  editingId = item? item.id : null;
  document.getElementById('sh-title').textContent = editingId? '活動を編集' : '活動を追加';
  document.getElementById('save').textContent = editingId? '保存する' : '保存する';
  if(item){
    form.date.value=item.date; form.title.value=item.title; form.place.value=item.place;
    form.who.value=item.who; form.metrics.value=item.num; form.description.value=item.desc;
    form.url.value=item.url; pickKind=item.kind;
  }else{
    form.date.value=new Date().toISOString().slice(0,10); pickKind='投稿';
  }
  pickWho='';
  seg(document.getElementById('kindseg'),KINDS,pickKind,v=>pickKind=v);
  seg(document.getElementById('whoseg'),WHOS,item?item.who:'',v=>{ pickWho=v; form.who.value=v; });
  document.getElementById('guess').textContent = editingId? '' : 'URLを貼ると、種別と媒体を自動で入れます';
  modal.hidden=false; document.body.style.overflow='hidden';
}

/* ---- 詳細 ---- */
const DFIELDS=[['date','日付'],['kind','種別'],['title','タイトル'],['place','媒体・場所'],
  ['who','担当'],['desc','概要'],['num','反応・数字'],['tag','タグ']];
function openDetail(item){
  detailItem=item;
  const rows=DFIELDS.filter(([k])=>item[k]).map(([k,l])=>
    `<div class="drow"><dt>${l}</dt><dd>${esc(item[k])}</dd></div>`).join('');
  const links=[
    item.url?`<div class="drow"><dt>リンク</dt><dd><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.url)}</a></dd></div>`:'',
    item.file?`<div class="drow"><dt>資料</dt><dd><a href="${esc(item.file)}" target="_blank" rel="noopener">${esc(decodeURIComponent(item.file.split('/').pop()))}</a></dd></div>`:'',
  ].join('');
  const img=/\.(png|jpe?g|gif|webp|heic)$/i.test(item.file||'')
    ? `<div class="dimg"><img src="${esc(item.file)}" alt=""></div>` : '';
  document.getElementById('dbody').innerHTML=rows+links+img;
  document.getElementById('del').hidden=!item.id;
  document.getElementById('edit').hidden=!item.id;
  dmodal.hidden=false; document.body.style.overflow='hidden';
}
function closeDetail(){ dmodal.hidden=true; document.body.style.overflow=''; detailItem=null; }
document.getElementById('dx').onclick=closeDetail;
document.getElementById('dclose').onclick=closeDetail;
dmodal.onclick=e=>{ if(e.target===dmodal) closeDetail(); };
document.getElementById('edit').onclick=()=>{ const it=detailItem; closeDetail(); openModal(it); };
document.getElementById('del').onclick=async()=>{
  const it=detailItem; if(!it) return;
  if(!confirm(`「${it.title}」を削除します。元に戻せません。`)) return;
  const code=getCode(); if(!code) return;
  try{
    const res=await fetch(REST+'?id=eq.'+it.id,{method:'DELETE',headers:codeHeaders()});
    const gone=await res.json().catch(()=>[]);
    if(!res.ok||!gone.length){ clearCode(); throw new Error('合言葉が違うようです'); }
    closeDetail(); toast('削除しました'); await load();
  }catch(ex){ alert(ex.message); }
};
document.addEventListener('click',e=>{
  if(e.target.closest('a')||e.target.closest('button')) return;
  const c=e.target.closest('.card[data-id]'); if(!c) return;
  const it=ITEMS.find(x=>x.id===c.dataset.id); if(it) openDetail(it);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const c=e.target.closest?.('.card[data-id]'); if(!c) return;
  const it=ITEMS.find(x=>x.id===c.dataset.id); if(it) openDetail(it);
});
function closeModal(){ modal.hidden=true; document.body.style.overflow=''; }
document.getElementById('add').onclick=()=>openModal(null);
document.getElementById('x').onclick=closeModal;
document.getElementById('cancel').onclick=closeModal;
modal.onclick=e=>{ if(e.target===modal) closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  if(!modal.hidden) closeModal(); else if(!dmodal.hidden) closeDetail(); });

const SITES=[
  [/instagram\.com\/reel/i,'投稿','Instagram（リール）'],
  [/instagram\.com/i,'投稿','Instagram'],
  [/note\.com/i,'投稿','note'],
  [/(twitter|x)\.com/i,'投稿','X'],
  [/youtube\.com|youtu\.be/i,'投稿','YouTube'],
  [/tiktok\.com/i,'投稿','TikTok'],
  [/facebook\.com/i,'投稿','Facebook'],
  [/prtimes\.jp/i,'メディア掲載','PR TIMES'],
];
form.url.addEventListener('input',()=>{
  const v=form.url.value.trim(); if(!v) return;
  for(const [re,k,p] of SITES){
    if(re.test(v)){
      pickKind=k; form.place.value=p;
      seg(document.getElementById('kindseg'),KINDS,k,x=>pickKind=x);
      document.getElementById('guess').textContent=`${p} の${k}として登録します`;
      return;
    }
  }
  document.getElementById('guess').textContent='種別と媒体は手で選んでください';
});

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'), save=document.getElementById('save');
  err.textContent='';
  if(!READY){ err.textContent='まだデータベースに繋がっていません'; return; }
  save.disabled=true; save.textContent='保存中…';
  try{
    let fileUrl=null;
    const f=form.file.files[0];
    if(f){
      if(f.size>20*1024*1024) throw new Error('ファイルは20MBまでです');
      const path=Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
      const up=await fetch(SB_URL+'/storage/v1/object/pr-files/'+encodeURIComponent(path),
        {method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:f});
      if(!up.ok) throw new Error('ファイルを上げられませんでした');
      fileUrl=SB_URL+'/storage/v1/object/public/pr-files/'+encodeURIComponent(path);
    }
    const body={ date:form.date.value, kind:pickKind, title:form.title.value.trim(),
      place:form.place.value.trim()||null, who:(form.who.value||pickWho).trim()||null,
      description:form.description.value.trim()||null, url:form.url.value.trim()||null,
      file_url:fileUrl, metrics:form.metrics.value.trim()||null, tag:null };
    if(editingId){
      const code=getCode(); if(!code) throw new Error('合言葉が必要です');
      if(!fileUrl) delete body.file_url;
      const res=await fetch(REST+'?id=eq.'+editingId,{method:'PATCH',headers:codeHeaders(),body:JSON.stringify(body)});
      const changed=await res.json().catch(()=>[]);
      if(!res.ok||!changed.length){ clearCode(); throw new Error('合言葉が違うようです'); }
      closeModal(); toast('保存しました');
    }else{
      const res=await fetch(REST,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)});
      if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）');
      closeModal(); toast('登録しました');
    }
    await load();
  }catch(ex){ err.textContent=ex.message; }
  finally{ save.disabled=false; save.textContent='保存する'; }
});

/* ============ CSV書き出し ============ */
document.getElementById('csv').onclick=()=>{
  const q=v=>'"'+(v||'').replace(/"/g,'""')+'"';
  let out='\ufeff日付,種別,タイトル,媒体・場所,担当,概要,URL,ファイル,反応・数字,タグ\n';
  ITEMS.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(i=>{
    out+=[i.date,i.kind,i.title,i.place,i.who,i.desc,i.url,i.file,i.num,i.tag].map(q).join(',')+'\n'; });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));
  a.download='キネコPR活動ログ.csv'; a.click();
};

load(false);
</script>
